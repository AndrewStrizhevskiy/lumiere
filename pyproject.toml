[project]
name = "kino-stream"
version = "0.3.0"
description = "Watch a torrent while it downloads, with a hard-bounded disk cache (desktop app and CLI)"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)", "Operating System :: POSIX :: Linux", "Development Status :: 4 - Beta"]
# python-libtorrent is NOT pip-installed: use the distribution package (sudo apt install python3-libtorrent mpv)
dependencies = []

[project.scripts]
kino-stream = "kino_stream.__main__:main"
kino-stream-gui = "kino_stream_ui.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kino_stream", "kino_stream_ui"]

[tool.setuptools.package-data]
kino_stream_ui = ["assets/*.svg"]
